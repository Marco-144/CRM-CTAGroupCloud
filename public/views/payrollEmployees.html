<div class="payroll-employees-view">
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-4">
        <div>
            <h4 class="fw-semibold mb-1">Empleados</h4>
            <small class="text-muted">Alta y administracion de empleados para nomina.</small>
        </div>
        <button class="btn btn-primary rounded-3" id="openPayrollEmployeeModal" data-bs-toggle="modal"
            data-bs-target="#payrollEmployeeModal">
            <i class="bi bi-plus-lg"></i> Agregar Empleado
        </button>
    </div>

    <div class="card border-0 shadow-sm rounded-4 p-3 p-md-4">
        <div class="table-responsive">
            <table class="table align-middle mb-0">
                <thead>
                    <tr>
                        <th>Empleado</th>
                        <th>Sueldo Neto</th>
                        <th>Periodicidad</th>
                        <th>Inicio</th>
                        <th>Estatus</th>
                        <th>Saldo Pendiente</th>
                        <th class="text-end">Acciones</th>
                    </tr>
                </thead>
                <tbody id="payrollEmployeesTableBody"></tbody>
            </table>
        </div>
    </div>

    <div class="modal fade" id="payrollEmployeeModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content rounded-4">
                <div class="modal-header">
                    <h5 class="modal-title" id="payrollEmployeeModalTitle">Agregar Empleado</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="payrollEmployeeForm">
                        <input type="hidden" id="payrollEmployeeId">

                        <div class="mb-3">
                            <label class="form-label">Usuario</label>
                            <select class="form-select" id="payrollEmployeeUser" required>
                                <option value="" selected disabled>Selecciona un usuario</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Sueldo Neto</label>
                            <input type="number" min="0" step="0.01" class="form-control" id="payrollEmployeeSalary"
                                required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Periodicidad</label>
                            <select class="form-select" id="payrollEmployeeFrequency" required>
                                <option value="" selected disabled>Selecciona periodicidad</option>
                                <option value="Semanal">Semanal</option>
                                <option value="Quincenal">Quincenal</option>
                                <option value="Mensual">Mensual</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Fecha Inicio</label>
                            <input type="date" class="form-control" id="payrollEmployeeStartDate" required>
                        </div>

                        <div class="form-check form-switch mb-3">
                            <input class="form-check-input" type="checkbox" role="switch" id="payrollEmployeeActive"
                                checked>
                            <label class="form-check-label" for="payrollEmployeeActive">Activo</label>
                        </div>

                        <button type="submit" class="btn btn-primary w-100" id="savePayrollEmployeeBtn">Guardar</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
