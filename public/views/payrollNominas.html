<div class="payroll-nominas-view">
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-4">
        <div>
            <h4 class="fw-semibold mb-1">Nominas</h4>
            <small class="text-muted">Control de sueldos a deber y pagos por empleado.</small>
        </div>
    </div>

    <div class="row g-3 mb-4">
        <div class="col-12 col-md-6 col-xl-4">
            <div class="card border-0 shadow-sm rounded-4 p-3">
                <small class="text-muted">Total Sueldos por Pagar</small>
                <h4 class="fw-bold mb-0" id="payrollGlobalPendingKpi">$0.00</h4>
            </div>
        </div>
        <div class="col-12 col-md-6 col-xl-4">
            <div class="card border-0 shadow-sm rounded-4 p-3">
                <small class="text-muted">Cargos Pendientes</small>
                <h4 class="fw-bold mb-0" id="payrollPendingChargesKpi">0</h4>
            </div>
        </div>
    </div>

    <div class="card border-0 shadow-sm rounded-4 p-3 p-md-4 mb-4">
        <div class="row g-2 align-items-end">
            <div class="col-12 col-md-2">
                <label class="form-label mb-1">Empleado</label>
                <select class="form-select" id="payrollChargesEmployeeFilter">
                    <option value="">Todos</option>
                </select>
            </div>
            <div class="col-12 col-md-2">
                <label class="form-label mb-1">Estatus</label>
                <select class="form-select" id="payrollChargesStatusFilter">
                    <option value="">Todos</option>
                    <option value="Pendiente">Pendiente</option>
                    <option value="Pagado Parcial">Pagado Parcial</option>
                    <option value="Pagado">Pagado</option>
                </select>
            </div>
        </div>
    </div>

    <div class="card border-0 shadow-sm rounded-4 p-3 p-md-4">
        <div class="table-responsive">
            <table class="table align-middle mb-0">
                <thead>
                    <tr>
                        <th>Empleado</th>
                        <th>Vencimiento</th>
                        <th>Periodo</th>
                        <th>Monto</th>
                        <th>Pagado</th>
                        <th>Pendiente</th>
                        <th>Estatus</th>
                        <th class="text-end">Acciones</th>
                    </tr>
                </thead>
                <tbody id="payrollChargesTableBody"></tbody>
            </table>
        </div>
    </div>

    <div class="modal fade" id="payrollPaymentModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content rounded-4">
                <div class="modal-header">
                    <h5 class="modal-title">Registrar Pago de Nomina</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="payrollPaymentForm">
                        <input type="hidden" id="payrollPaymentChargeId">

                        <div class="mb-2 small text-muted" id="payrollPaymentChargeInfo"></div>

                        <div class="mb-3">
                            <label class="form-label">Monto</label>
                            <input type="number" min="0" step="0.01" class="form-control" id="payrollPaymentAmount"
                                required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Metodo</label>
                            <select class="form-select" id="payrollPaymentMethod" required>
                                <option value="" selected disabled>Selecciona metodo</option>
                                <option value="Efectivo">Efectivo</option>
                                <option value="Transferencia">Transferencia</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Referencia (opcional)</label>
                            <input type="text" class="form-control" id="payrollPaymentReference" maxlength="120">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Nota (opcional)</label>
                            <textarea class="form-control" id="payrollPaymentNotes" rows="2"></textarea>
                        </div>

                        <button type="submit" class="btn btn-primary w-100">Guardar Pago</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="payrollPaymentHistoryModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content rounded-4">
                <div class="modal-header">
                    <h5 class="modal-title">Historial de Pagos</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="table-responsive">
                        <table class="table align-middle mb-0">
                            <thead>
                                <tr>
                                    <th>Fecha</th>
                                    <th>Monto</th>
                                    <th>Metodo</th>
                                    <th>Referencia</th>
                                    <th>Nota</th>
                                    <th class="text-end">Accion</th>
                                </tr>
                            </thead>
                            <tbody id="payrollPaymentHistoryBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
