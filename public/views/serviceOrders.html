<div class="cotizacion-view service-orders-view">
    <div class="d-flex justify-content-between align-items-center mb-4 gap-2 flex-wrap">
        <div class="d-flex align-items-center gap-2">
            <button class="btn btn-light d-lg-none sidebar-mobile-toggle" id="mobileMenuBtn" type="button"
                aria-label="Abrir menú lateral">
                <i class="bi bi-list fs-4"></i>
            </button>
            <h4 class="fw-semibold mb-0">Órdenes de Servicio</h4>
        </div>

        <div class="d-flex align-items-center gap-2 flex-wrap">
            <button class="btn btn-light payroll-filters-toggle" id="serviceOrdersFiltersToggleBtn" type="button"
                aria-expanded="false" aria-controls="serviceOrdersFiltersPanel" title="Filtros">
                <i class="bi bi-funnel"></i>
            </button>
            <button class="btn btn-primary rounded-3" id="openAddSO">
                <i class="bi bi-plus-lg"></i> Nueva Orden
            </button>
        </div>
    </div>

    <div class="service-orders-filters-float d-none" id="serviceOrdersFiltersPanel" aria-hidden="true">
        <div class="card border-0 shadow-lg rounded-4 p-3 p-md-4 service-orders-filters-card">
            <div class="mb-3">
                <h6 class="fw-semibold mb-0">Filtros</h6>
            </div>

            <div class="d-flex flex-column gap-3">
                <div class="w-100">
                    <label class="form-label mb-1">Buscar</label>
                    <input type="text" class="form-control service-order-filter-control" id="soSearch"
                        placeholder="Buscar orden...">
                </div>
                <div class="w-100">
                    <label class="form-label mb-1">Estatus</label>
                    <select class="form-select service-order-filter-control" id="soStatusFilter">
                        <option value="">Todos</option>
                        <option value="pendiente">Pendientes</option>
                        <option value="activa">Activas</option>
                        <option value="completada">Completadas</option>
                        <option value="cancelada">Canceladas</option>
                    </select>
                </div>
                <div class="w-100">
                    <label class="form-label mb-1">Prioridad</label>
                    <select class="form-select service-order-filter-control" id="soPriorityFilter">
                        <option value="">Todas</option>
                        <option value="urgente">Urgente</option>
                        <option value="alto">Alta</option>
                        <option value="medio">Media</option>
                        <option value="bajo">Baja</option>
                    </select>
                </div>
                <div class="w-100">
                    <label class="form-label mb-1">Desde</label>
                    <input type="date" class="form-control service-order-filter-control" id="soDateFrom">
                </div>
                <div class="w-100">
                    <label class="form-label mb-1">Hasta</label>
                    <input type="date" class="form-control service-order-filter-control" id="soDateTo">
                </div>
            </div>
        </div>
    </div>

    <div id="serviceOrdersBoard" class="service-orders-board"></div>

    <div class="modal fade" id="serviceOrderModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content rounded-4">
                <div class="modal-header">
                    <h5 class="modal-title fw-semibold" id="serviceOrderModalTitle">Nueva Orden de Servicio</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <form id="serviceOrderForm">
                    <div class="modal-body">
                        <input type="hidden" id="soId">

                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label">Cliente</label>
                                <select class="form-select" id="soProspect" required></select>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">Ticket (opcional)</label>
                                <select class="form-select" id="soTicket"></select>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">Tipo de servicio</label>
                                <input type="text" class="form-control" id="soServiceType" required>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">Prioridad</label>
                                <select class="form-select" id="soPriority" required>
                                    <option value="bajo">Bajo</option>
                                    <option value="medio" selected>Medio</option>
                                    <option value="alto">Alto</option>
                                    <option value="urgente">Urgente</option>
                                </select>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">Estatus</label>
                                <select class="form-select" id="soStatus" required>
                                    <option value="pendiente" selected>Pendiente</option>
                                    <option value="activa">Activa</option>
                                    <option value="completada">Completada</option>
                                    <option value="cancelada">Cancelada</option>
                                </select>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">Fecha inicio</label>
                                <input type="date" class="form-control" id="soStartDate">
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">Fecha entrega estimada</label>
                                <input type="date" class="form-control" id="soEstimatedDelivery">
                            </div>

                            <div class="col-12">
                                <label class="form-label">Descripción</label>
                                <textarea class="form-control" id="soDescription" rows="3"></textarea>
                            </div>

                            <div class="col-12">
                                <label class="form-label">Adjuntos iniciales</label>
                                <input type="file" class="form-control" id="soAttachment"
                                    accept="image/*,application/pdf" multiple>
                                <small class="text-muted">Opcional: uno o varios archivos (imagenes o PDF, max 8MB por
                                    archivo)</small>
                            </div>

                            <div class="col-12">
                                <div class="service-order-assigned-section">
                                    <div class="d-flex justify-content-between align-items-center gap-2 flex-wrap">
                                        <div>
                                            <label class="form-label mb-1">Asignados</label>
                                            <small class="text-muted d-block">Selecciona un usuario y usa el botón +
                                                para agregar otro sin repetirlos.</small>
                                        </div>
                                    </div>
                                    <div id="soAssignedUsersContainer" class="service-order-assigned-list"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-outline-secondary"
                            data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-primary" id="saveSO">Guardar Orden</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

</div>
